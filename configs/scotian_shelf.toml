# =============================================================================
# TethysFlow - Scotian Shelf Production Hydrodynamic Configuration
# =============================================================================
# High-resolution hydrodynamic configuration for the Scotian Shelf and Gulf of
# Maine. Drives the 3D circulation model using real ETOPO/NWA bathymetry,
# Open-Meteo ERA5 surface wind forcing, TPXO9 tidal harmonics, and Copernicus
# Marine GLORYS12V1 boundary relaxation.
#
#   julia --project=. TethysFlowRun.jl --config=configs/scotian_shelf.toml --all
# =============================================================================

[domain]
# Geographic bounding box in degrees (WGS84, EPSG:4326)
lon_min = -68.0               # Western boundary longitude (°E)
lon_max = -56.0               # Eastern boundary longitude (°E)
lat_min = 41.0                # Southern boundary latitude (°N, aligned to shelf slope margin)
lat_max = 48.0                # Northern boundary latitude (°N)
z_min = -350.0                # Maximum shelf bathymetric depth (m, epipelagic & mesopelagic zone).
                               # Ignored when [grid] depths is given: the deepest face is the
                               # floor of the column, and these depths end at 400 m.
z_max = 0.0                   # Free surface elevation (m). Ignored when [grid] depths is
                               # given: the first face is the surface.
buffer_km = 50.0              # The margin beyond the study area (km). The lateral sponge
                               # band is this margin: the model relaxes toward the prescribed
                               # ocean across it, so the band is derived from it (about 0.45).

# Map Projection and Orientation
# Options: "geographic" (default, WGS84 LatitudeLongitudeGrid)
#          "utm"        (Universal Transverse Mercator via CoordRefSystems.jl, zone = 20)
#          "lambert"    (Lambert Conformal Conic via CoordRefSystems.jl)
#          "mercator"   (Mercator projection via CoordRefSystems.jl)
#          "rotated"    (Conformal local tangent frame rotated along shelf axis)
projection = "rotated"
rotation_deg = 55.0           # Grid rotation angle (~55° counter-clockwise from East aligns with shelf margin)
lon_center = -62.0            # Center longitude of the rotated frame (°E)
lat_center = 44.5             # Center latitude of the rotated frame (°N)
extent_along_shelf_km = 1056.0 # Along-shelf extent (km; Browns Bank to Laurentian Channel / Grand Banks margin)
extent_cross_shelf_km = 384.0  # Cross-shelf extent (km; coastal margin to slope break, excluding abyssal plain)

[grid]
# Rotated along-shelf domain at 2.0 km isotropic horizontal resolution:
# - dx = 1056.0 km / 528 = 2000.0 m (along-shelf)
# - dy =  384.0 km / 192 = 2000.0 m (cross-shelf)
# Both nx=528 and ny=192 are divisible by 16, 24, 48 for parallel decompositions and FFTs.
# Compared to the unrotated box (480 x 390 = 187,200 cells), total horizontal cells
# are reduced to 528 x 192 = 101,376 (46% reduction in cell count and runtime).
nx = 528
ny = 192
vertical_stretching_mode = "oceananigans"
nz_above = 0
vertical_break_depth = 350.0
vertical_grid_file = ""
nz = 23
depths = [
    0.0, 10.0, 20.0, 35.0, 50.0, 75.0, 100.0, 125.0, 150.0, 175.0,
    200.0, 225.0, 250.0, 275.0, 300.0, 350.0, 400.0, 500.0, 600.0,
    750.0, 900.0, 1050.0, 1250.0, 1500.0
]

[bathymetry]
# Real shelf topography and geometry controls
inshore_depth = 10.0              # Water depth at inshore boundary (m, positive downward)
shelf_slope = 180.0               # Total shelf relief / rise across shelf (m; break - inshore = 180 m)
mask_bay_of_fundy = true      # Damp excessive non-linear resonance in Bay of Fundy

[data]
# Real-world assimilated data sources
bathy_source = "nwa_bathymetry" # Northwest Atlantic high-resolution bathymetry
coastline_source = "natural_earth_10m" # High-resolution coastline vector
wind_source = "open_meteo"    # Hourly surface wind stress from ERA5 reanalysis
wind_time_iso = "2020-06-01T00:00:00Z" # Epoch for wind stress forcing
hydrography_source = "glorys12v1" # 3D ocean state: Copernicus Marine GLORYS12V1
hydrography_month = 0         # Month index (0 = dynamic seasonal climatology)

[atmosphere]
# Atmospheric forcing and surface boundary fluxes
source = "open_meteo"         # ERA5 hourly atmospheric state
bulk_heat_flux = true         # Compute dynamic air-sea heat fluxes

[boundaries]
# Open boundary conditions via lateral sponge relaxation
method = "relaxation"         # Lateral boundary relaxation
obc_type = "flather_chapman"  # Radiation boundary formulation
ocean_boundary_source = "glorys12v1" # Target tracer and velocity state from GLORYS12V1
# The sponge band's width is [domain] buffer_km: the band the model relaxes
# toward the prescribed ocean lives in the margin beyond the study area, so
# it is the same quantity, and the band in degrees is derived from it.
sponge_timescale_seconds = 3600.0 # Robust 1-hour sponge relaxation timescale
active_boundaries = ["east","south"] # Upstream along-shelf inflow boundary (Nova Scotia Current)
# The momentum boundary relaxes toward the OBSERVED velocity when the boundary source
# carries one, and GLORYS12V1 does (uo, vo). `u_inflow`/`v_inflow` are the fallback for
# a source with no currents -- WOA23 has none -- and are used only when there are none.
u_inflow = -0.10              # Fallback: southwestward Labrador / Nova Scotia Current (m/s)
v_inflow = 0.0                # Fallback: zero cross-isobath inflow (m/s)

[tides]
# Astronomical tidal body and boundary forcing
#
# TPXO9 boundary forcing (placement = :boundary): tide enters through the open
# boundary sponge zone only, allowing the barotropic tidal wave to propagate
# inward dynamically. This avoids the resonance that the uniform analytic
# body forcing caused (8-13 m/s divergence within 6 hours).
#
# TethysDrift (the larval half) superimposes analytic M2/S2 tidal velocity
# onto the stored hydrodynamic flow field at particle-advection time
# (TethysDrift/src/biology/larval_behavior.jl:superpose_tidal_velocity).
# DO NOT enable both ocean-model tide and larval-tracking tide simultaneously
# unless you intend double-counting.
#
# For this Scotian Shelf run, tide is enabled in the ocean model at the boundary
# only (placement = "boundary"). TethysDrift will add its own analytic
# tidal velocity at particle time. If you want consistency between the two,
# disable tide in TethysDrift or set enable_tides = false here.
#
enable_tides = true             # Enable TPXO9 tidal boundary forcing
tides_source = "tpxo9"          # TPXO9 global tidal atlas (not "analytic")
tidal_placement = "boundary"    # Edge-only relaxation: tide propagates inward dynamically. both, interior, boundary
tidal_relaxation_timescale = 3600.0 # 1-hour tidal relaxation timescale at open edges
tidal_constituents = ["M2", "S2", "N2"] # Semidiurnal constituents
tidal_u_amp = 0.0               # Unused with tpxo9 source (amplitudes come from atlas)
tidal_v_amp = 0.0               # Unused with tpxo9 source
s2_u_amp = 0.0                  # Unused with tpxo9 source
s2_v_amp = 0.0                  # Unused with tpxo9 source

[hydrodynamics]
# Numerical solver controls and adaptive stepping
#
# The time step is bounded by the barotropic gravity wave, not by advection. With 45
# split substeps, a 2 km cell and the deepest water in the domain (400 m, so
# c = sqrt(gH) = 63 m/s), the wave Courant number is c * (dt/45) / dx = 0.167 at
# dt = 240 s. `max_dt` is held at 240 s to stay under the 0.2 wave target.
#
# `target_cfl` is NOT the advective Courant number, and treating it as one is why it
# looks mis-set. The reported "CFL" is max(advective, 0.5 * drag), and the drag term
# -- cd*|u| * dt with cd = 2.5e-3 -- dominates the advective terms at EVERY speed,
# because 0.5*cd*dx = 2.7 and 0.5*cd*dy = 5.2. The controller is therefore really
# setting dt = 0.4 / (2.5e-3 * |u|_max), and the advective Courant number sits near
# 0.03, an order of magnitude below the target. Lowering `target_cfl` would cost
# wall-clock time and buy no accuracy: the step size is protecting the bottom drag,
# not the advection.
#
# The quadratic seabed friction coefficient. It is applied to the model as a `BulkDrag`
# bottom boundary condition on the sea floor, and it is the drag the step controller
# protects, so the two are read from this one number.
cd_drag = 2.5e-3
#
# Duration is set for a run that completes end to end. The shelf at this resolution
# resolves mesoscale structure and the spring/neap cycle; a multi-year integration at
# 2 km is a multi-week compute job and is better launched as a checkpointed run than
# held in a single session.
# sim_duration_hours = 168.0      # 7-day integration: two spring/neap cycles
sim_duration_hours = 13140.0      # 1.5 yr production run
sim_dt_seconds = 30.0          # Baseline time step in seconds
min_dt_seconds = 10.0          # Minimum adaptive time step floor (seconds)
max_dt_seconds = 260.0         # Maximum adaptive time step ceiling (barotropic-CFL safe at 2 km)
adaptive_cfl = true           # Modulate dt according to advective and wave CFL
target_cfl = 0.2             # Target advective CFL limit (increased from 0.08 for stability)
target_wave_cfl = 0.2        # Target barotropic gravity wave CFL limit (increased from 0.08 for stability)
surface_heat_flux = 50.0      # Baseline sensible heat flux (W/m^2)
sst_damping_coefficient = 40.0 # Haney SST relaxation (W m-2 K-1)
max_current_speed = 2.0       # Current velocity ceiling in m/s (reduced from 3.0 for stability)
max_flow_snapshots = 400      # Snapshot memory retention limit
spinup_hours = 168.0           # 7 day spin-up before the first output is written
# spinup_hours = 720.0           # 30 day spin-up, for a run that has to reach equilibrium
allow_analytical_fallback = false # Fail loudly if real inputs unavailable
hydro_model_file = ""         # Hydrodynamic model checkpoint
reuse_hydro = false           # Reuse existing flow fields if present


[storage]
# Output persistence and Lakehouse state archiving
#
# `output_dir` is the single place this run writes. Everything else is derived from it:
#   <output_dir>/hydrodynamics.zarr  the 4-D field store (T, u, v, w, time)
#   <output_dir>/checkpoints/         restart archives
#   <output_dir>/inputs/              the ingested-data cache for this run
# There is no separate path setting: a second path for the same store is a second
# source of truth, and the two disagreeing is a silent data-loss bug.
output_dir = "../lakehouse/TethysFlow/scotian_shelf" # Target Lakehouse directory
output_schedule_seconds = 1800.0 # Field snapshot every 30 min: 337 intervals over 7 days, enough for the tidal cycle to animate
progress_schedule_seconds = 900.0 # Progress report every 15 min of simulated time (time-based, so the cadence does not drift as Δt ramps)
max_save_depth = 400.0        # Keep every level (the shelf is 350 m deep) for larval drift
enable_checkpoint = true      # Enable state checkpointer
checkpoint_prefix = "scotian_shelf_checkpoint" # Checkpoint prefix
# Checkpoint interval, in SIMULATED seconds.
#
# This is a full serialisation of the model state -- every prognostic field copied to
# the host and written -- and it happens INSIDE the timestep, so the interval is paid for
# in wall-clock time on every step. At 1800 s, with the time step at its 240 s ceiling,
# that is one checkpoint every seven and a half model iterations, and the run spent more
# time writing checkpoints than integrating: eleven seconds per iteration against a
# quarter of a second for the physics.
#
# Six hours of simulated time is every ninety iterations, and a restart then loses at
# most six hours of simulation -- a few minutes of wall clock at this grid.
checkpoint_schedule_seconds = 432000.0 # Checkpoint every 5 days of simulated time
checkpoint_cleanup = false    # Keep multiple checkpoints for safe restart
run_id = ""                   # Unique identifier

[runtype]
# Execution environment and reproducibility
use_gpu = true                # Run on NVIDIA CUDA GPU
fallback_to_cpu = false       # Fail loudly if GPU is unavailable
seed = 42                     # Master RNG seed
